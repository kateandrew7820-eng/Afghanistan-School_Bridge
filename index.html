<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="پورتال دیجیتال داده‌های مکاتب افغانستان – یکپارچه‌سازی و انتقال اطلاعات آموزشی در سراسر کشور" />

    <!-- Preload critical app entry -->
    <link rel="modulepreload" href="/src/main.tsx" />

    <!-- Fonts: only Vazirmatn (UI) + Montserrat (headings). Async, non-blocking. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap"
      />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="پل آموزش افغانستان" />
    <meta property="og:description" content="پورتال دیجیتال داده‌های مکاتب افغانستان" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="پل آموزش افغانستان" />
    <meta name="twitter:description" content="پورتال دیجیتال داده‌های مکاتب افغانستان" />
    <meta name="author" content="SchoolBridge Afghanistan" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>پل آموزش افغانستان</title>

    <style>
      * { margin: 0; padding: 0; }
      html { direction: rtl; font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      html.ltr { direction: ltr; text-align: left; }
      html.rtl { direction: rtl; text-align: right; }
      body { direction: rtl; text-align: right; background: #ffffff; color: #0f172a; }
      body.ltr { direction: ltr; text-align: left; }
      input, textarea, select { direction: inherit; text-align: inherit; }
      /* Skeleton for first paint (avoid blank screen / improves LCP) */
      #root:empty::before {
        content: '';
        display: block;
        min-height: 100vh;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
