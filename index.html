<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Performance optimizations -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="پورتال داده‌های مکاتب افغانستان - اتصال آموزش در سراسر کشور" />
    
    <!-- Preload critical resources for faster initial load -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    
    <!-- Preconnect to external services for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.yourdomain.com">
    
    <!-- Fonts with better caching - async load -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="پل آموزش افغانستان" />
    <meta property="og:description" content="پورتال داده‌های مکاتب افغانستان" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Author -->
    <meta name="author" content="SchoolBridge Afghanistan" />
    
    <!-- Favicon with caching -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Web App Manifest for PWA -->
    <link rel="manifest" href="/manifest.json">
    
    <title>پل آموزش افغانستان</title>

    <style>
      /* RTL and Persian Font Support */
      * {
        margin: 0;
        padding: 0;
      }

      html {
        direction: rtl;
        font-family: 'Vazirmatn', 'Roboto', sans-serif;
      }

      html.ltr {
        direction: ltr;
        text-align: left;
      }

      html.rtl {
        direction: rtl;
        text-align: right;
      }

      body {
        direction: rtl;
        text-align: right;
      }

      body.ltr {
        direction: ltr;
        text-align: left;
      }

      /* Fix for inputs and textareas */
      input, textarea, select {
        direction: inherit;
        text-align: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
